
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 27.1.0
    helm:
      parameters:
        - name: alertmanager.enabled
          value: "false"
        - name: pushgateway.enabled
          value: "false"
        - name: server.persistentVolume.enabled
          value: "false"
      releaseName: prometheus
      namespace: monitoramento

  destination:
    server: https://1ac86603-f225-4ab1-8852-a770e851dea0.k8s.ondigitalocean.com
    namespace: monitoramento

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
