apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: review-filmes
  namespace: argocd
spec:
  project: exemplo-project
  source:
    repoURL: https://github.com/wesleymlopes/web-color-deploy
    path: review
    targetRevision: HEAD
  destination:
    namespace: review-filmes
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
