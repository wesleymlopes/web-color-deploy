apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web-color
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/wesleymlopes/web-color-deploy
    path: k8s
    targetRevision: HEAD
  destination:
    namespace: web-color
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
