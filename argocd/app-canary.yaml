apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webcolor-canary
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/wesleymlopes/web-color-deploy.git
    targetRevision: HEAD
    path: canary
  destination:
    server: https://1ac86603-f225-4ab1-8852-a770e851dea0.k8s.ondigitalocean.com
    namespace: webcolor
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true