apiVersion: batch/v1
kind: Job
metadata:
  generateName: pre-sync-
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  template:
    spec:
      containers:
        - name: chamada
          image: docker.io/curlimages/curl:latest
          command:
            - /bin/sh
            - -c
            - |
              curl -X POST -H "Content-Type: application/json" \
              -d '{"message": "Entrou em Pre Sync !!!"}' \
              https://webhook.site/44f17c3f-bffc-4219-bec5-ff84e2d83fea
      restartPolicy: Never
---
