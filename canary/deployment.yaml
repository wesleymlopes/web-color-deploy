apiVersion: v1
kind: Service
metadata:
  name: webcolor
  namespace: webcolor
spec:
  selector:
    app: webcolor
  ports:
  - port: 80
    targetPort: 80
  type: LoadBalancer
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: webcolor
  namespace: webcolor
spec:
  replicas: 4
  selector:
    matchLabels:
      app: webcolor
  template:
    metadata:
      labels:
        app: webcolor
    spec:
      imagePullSecrets:
      - name: ocir-secret
      containers:
      - name: webcolor
        image: gru.ocir.io/grglog7bpvjm/web-color:blue
        ports:
        - containerPort: 80
  minReadySeconds: 30
  strategy:
    canary:
      steps:
      - setWeight: 25
      - pause: {duration: 30s}
      - setWeight: 50
      - pause: {duration: 30s}
      - setWeight: 75
      - pause: {duration: 30s}
      - setWeight: 100